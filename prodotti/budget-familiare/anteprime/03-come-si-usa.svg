<text x="80" y="300" font-family="Helvetica,Arial" font-size="26" fill="#1b1d22">1. Sostituisci le categorie con le tue</text><text x="80" y="354" font-family="Helvetica,Arial" font-size="26" fill="#1b1d22">2. Scrivi il budget del mese nella colonna C</text><text x="80" y="408" font-family="Helvetica,Arial" font-size="26" fill="#1b1d22">3. Inserisci le spese reali: i totali si aggiornano</text>
